version: 2
updates:
  # Client + server-shared root package (Vite/Svelte app)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    ignore:
      # Major versions are breaking changes that need deliberate review
      # (e.g. express 5, mongoose 9). Only propose patch/minor updates
      # within the currently-pinned major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  # Express API server
  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
